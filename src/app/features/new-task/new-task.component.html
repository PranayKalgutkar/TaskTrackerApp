<div class="container">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Create New Task</mat-card-title>
        <mat-card-subtitle>Fill the form below to create a task 1</mat-card-subtitle>
      </mat-card-header>
  
      <mat-card-content>
        <form [formGroup]="newTaskForm" (ngSubmit)="createTask()">
          <div class="form-group">
            <label for="title">Task Title</label>
            <input id="title" formControlName="title" type="text" class="form-control" placeholder="Enter task title">
            <div *ngIf="newTaskForm.get('title')?.invalid && newTaskForm.get('title')?.touched" class="text-danger">
              Task title is required and should be at least 5 characters long.
            </div>
          </div>
  
          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" formControlName="description" class="form-control" placeholder="Enter task description"></textarea>
            <div *ngIf="newTaskForm.get('description')?.invalid && newTaskForm.get('description')?.touched" class="text-danger">
              Description is required and should be at least 10 characters long.
            </div>
          </div>
  
          <div class="form-group">
            <label for="dueDate">Due Date</label>
            <input id="dueDate" formControlName="dueDate" type="date" class="form-control">
            <div *ngIf="newTaskForm.get('dueDate')?.invalid && newTaskForm.get('dueDate')?.touched" class="text-danger">
              Due date is required.
            </div>
          </div>
  
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" formControlName="status" class="form-control">
              <option value="To Do">To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
  
          <div class="form-group">
            <label for="assignedUser">Assign User</label>
            <input id="assignedUser" formControlName="assignedUser" type="text" class="form-control" placeholder="Enter assigned user's name">
            <div *ngIf="newTaskForm.get('assignedUser')?.invalid && newTaskForm.get('assignedUser')?.touched" class="text-danger">
              Assigned user is required.
            </div>
          </div>
  
          <mat-card-actions>
            <button mat-raised-button color="primary" type="submit" [disabled]="newTaskForm.invalid">
              Create Task
            </button>
          </mat-card-actions>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
